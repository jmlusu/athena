# Production-like local testing with Docker Compose
# Usage: docker-compose -f docker-compose.prod.yml up --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env.production
    environment:
      - DATABASE_URL=postgresql://athena:athena@db:5432/athena
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_data:/app/company/athena

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_ATHENA_API_KEY=${VITE_ATHENA_API_KEY:-dev-admin-key}
    environment:
      - ATHENA_BACKEND_URL=http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=athena
      - POSTGRES_PASSWORD=athena
      - POSTGRES_DB=athena
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_data:
  db_data:
  redis_data: