version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athena-backend
    env_file: .env
    environment:
      - ATHENA_CORS_ORIGINS=https://yourdomain.com
      - ATHENA_DATA_DIR=/app/data
    volumes:
      - data:/app/data
      - artifacts:/app/artifacts
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: prod
    container_name: athena-frontend
    env_file: .env
    environment:
      - VITE_ATHENA_API_BASE=http://backend:8000/api/v1/athena
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Reverse proxy (Caddy for auto HTTPS)
  caddy:
    image: caddy:2-alpine
    container_name: athena-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  data:
  artifacts:
  caddy_data:
  caddy_config: