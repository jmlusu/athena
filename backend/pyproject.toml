[project]
name = "athena"
version = "0.1.0"
description = "Athena job-scraping and application platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.0",
    "httpx>=0.28.1",
    "google-genai>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "python-docx>=1.1.0",
    "filelock>=3.16.0",
    "python-dotenv>=1.0.0",
    "structlog>=25.1.0",
    "email-validator>=2.2.0",
    "numpy>=2.5.3",
    "sentence-transformers>=3.0.0",
    "playwright>=1.63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["athena*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".git", "__pycache__", "dist", "build", "*.egg-info", "backend/tests/test_athena_api.py"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T10", "PTH", "ERA", "PL", "RET", "PERF", "ARG", "TID", "FURB", "LOG", "TRY", "NPY", "PD", "EXE", "COM",
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_reexport = true
allow_redefinition = false
local_partial_types = true
explicit_package_bases = true
namespace_packages = true
exclude = [
    "src/athena/ai/providers",
]

[[tool.mypy.overrides]]
module = [
    "athena.api.routes",
    "athena.api.ai_routes",
    "athena.scrapers.*",
    "athena.automation.*",
    "athena.documents.*",
    "athena.ats.*",
    "athena.matching.*",
    "athena.scheduler.*",
    "athena.ai.*",
    "athena.ai.providers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/athena"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]