version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: athena-backend-staging
    env_file:
      - .env.staging
    environment:
      - ATHENA_API_KEY=${ATHENA_API_KEY:-dev-admin-key}
      - ATHENA_CORS_ORIGINS=${ATHENA_CORS_ORIGINS:-http://localhost:8421,http://127.0.0.1:8421}
      - ATHENA_AUTH_MODE=api_key
      - ATHENA_RATE_LIMIT=${ATHENA_RATE_LIMIT:-100}
      - ATHENA_DATA_DIR=/app/company/athena
      - ATHENA_HITL_EXTERNAL=false
      - ATHENA_LLM_PROVIDER=
      - ATHENA_AI_PROVIDER=${ATHENA_AI_PROVIDER:-fallback}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ATHENA_N8N_WEBHOOK_URL=${ATHENA_N8N_WEBHOOK_URL:-https://n8n.athena-ops.internal/webhook/athena-pipeline-trigger}
      - ATHENA_SCHEDULER_AUTOSTART=${ATHENA_SCHEDULER_AUTOSTART:-true}
      - ATHENA_DEFAULT_SCRAPE_QUERY=${ATHENA_DEFAULT_SCRAPE_QUERY:-software engineer}
      - ATHENA_DEFAULT_SCRAPE_LOCATION=${ATHENA_DEFAULT_SCRAPE_LOCATION:-}
      - ATHENA_DEFAULT_SCRAPE_MAX=${ATHENA_DEFAULT_SCRAPE_MAX:-50}
      - AISTUDIO_PREVIEW=${AISTUDIO_PREVIEW:-false}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
    volumes:
      - athena_staging_data:/app/company/athena
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - athena-staging-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: athena-frontend-staging
    env_file:
      - .env.staging
    environment:
      - AISTUDIO_PREVIEW=${AISTUDIO_PREVIEW:-false}
      - ATHENA_BACKEND_URL=http://backend:8000
    ports:
      - "8421:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - athena-staging-network

volumes:
  athena_staging_data:

networks:
  athena-staging-network:
    driver: bridge