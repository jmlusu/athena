name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  preflight:
    name: Check deploy configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          DEPLOY_HOST: ${{ secrets.OCI_HOST }}
          DEPLOY_KEY: ${{ secrets.OCI_SSH_KEY }}
          DEPLOY_USER: ${{ vars.OCI_USER }}
          DEPLOY_DIR: ${{ vars.OCI_REPO_DIR }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_KEY" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_DIR" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::OCI credentials not configured (secrets.OCI_HOST, secrets.OCI_SSH_KEY, vars.OCI_USER, vars.OCI_REPO_DIR)."
          fi

  deploy:
    name: Deploy to Oracle Cloud
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ vars.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd "${{ vars.OCI_REPO_DIR }}"
            git fetch --prune origin
            git checkout main
            git pull --ff-only origin main
            bash deploy/oci-deploy.sh