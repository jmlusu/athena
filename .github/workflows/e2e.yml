name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'
          python-version: '3.12'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend services
        run: |
          docker-compose up -d backend redis
          # Wait for backend to be healthy
          for i in {1..30}; do
            if curl -f http://localhost:8520/health; then
              echo "Backend is healthy"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8530
          E2E_API_KEY: dev-admin-key
          CI: true
        run: pnpm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@4c6f2b2a5b1d6c6e7d6b6c6e7d6b6c6e7d6b6c6e7
        with:
          name: playwright-report
          path: frontend/e2e/test-results/html-report/
          retention-days: 7

      - name: Upload Playwright test results (JSON)
        if: always()
        uses: actions/upload-artifact@4c6f2b2a5b1d6c6e7d6b6c6e7d6b6c6e7d6b6c6e7
        with:
          name: playwright-results
          path: frontend/e2e/test-results/results.json
          retention-days: 7

      - name: Upload Playwright test results (JUnit)
        if: always()
        uses: actions/upload-artifact@4c6f2b2a5b1d6c6e7d6b6c6e7d6b6c6e7d6b6c6e7
        with:
          name: playwright-junit
          path: frontend/e2e/test-results/results.xml
          retention-days: 7

      - name: Comment PR with test summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const resultsPath = path.join(process.env.GITHUB_WORKSPACE, 'frontend/e2e/test-results/results.json');
            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const passed = results.suites.reduce((acc, suite) => acc + suite.specs.filter(s => s.ok).length, 0);
              const failed = results.suites.reduce((acc, suite) => acc + suite.specs.filter(s => !s.ok).length, 0);
              const total = passed + failed;
              
              const body = `## 🎭 Playwright E2E Test Results
              
              | Metric | Count |
              |--------|-------|
              | ✅ Passed | ${passed} |
              | ❌ Failed | ${failed} |
              | **Total** | **${total}** |
              
              ${failed > 0 ? '⚠️ Some tests failed. Check the workflow artifacts for details.' : '✅ All tests passed!'}`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }